# CI/CD for Aurynix Apex
#
# test   (every push and pull request): install from uv.lock, then `make lint` and `make test`.
#        Tests use synthetic data, so no dataset, model, or secret is needed.
# docker (after test passes): build the image on pull requests to prove it still builds;
#        on main, also push it to GitHub Container Registry (ghcr.io/aurynix/aurynix-apex).
#        The image has no data and no model: models/ is mounted at runtime (docs/deployment.md).

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0 # this action has no floating major tag
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install dependencies (locked)
        run: uv sync --frozen

      - name: Lint
        run: make lint

      - name: Test
        run: make test

  docker:
    name: Docker image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Build (and push on main)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
